name: ci
on:
  pull_request:
    branches: [main]

# Least privilege: GITHUB_TOKEN bekommt repo-weit nur Lesezugriff.
# Jobs, die mehr brauchen, bekommen es explizit und einzeln (aktuell keiner).
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r litellm/requirements-guardrail.txt -r test/requirements.txt
      # -s ./test statt -s test: aus einem anderen Arbeitsverzeichnis
      # sammelt "-s test" sonst stillschweigend die Python-Stdlib-Suite
      # namens "test" ein (falsch-gruenes Gate, siehe DATENSCHLE-62). Mit
      # ./test schlaegt der Aufruf fehl statt falsch gruen zu werden, wenn
      # das Arbeitsverzeichnis mal nicht das Repo-Root ist.
      - run: python3 -m unittest discover -s ./test -p "test_*.py"

  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Kein Linter (ruff/flake8/...) festgelegt -- das ist eine
      # Tech-Stack-Entscheidung fuer docs/foundation/techstack.md, die Oliver
      # trifft, keine stillschweigende Wahl im CI-Workflow. Bis dahin nur ein
      # Syntax-Check ohne neue Dependency: prueft, dass jede Datei parst.
      - run: python3 -m compileall -q litellm test presidio

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (Secrets-Scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Laufzettel pruefen (SHA-gepinnte Verdicts)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/check-laufzettel.sh
