name: ci
on:
  pull_request:
    branches: [main]

# Least privilege: GITHUB_TOKEN bekommt repo-weit nur Lesezugriff.
# Jobs, die mehr brauchen, bekommen es explizit und einzeln (aktuell keiner).
permissions:
  contents: read
  # Nur fuer den SARIF-Upload im `security`-Job (Audit-Fund MEDIUM-4).
  security-events: write

# SUPPLY-CHAIN-REGEL (DATENSCHLE-59), bindend fuer diese Datei:
# JEDE `uses:`-Zeile wird auf einen Commit-SHA gepinnt, nie auf ein Tag.
# Ein Tag wie `@v4` ist verschiebbar -- wer ihn verschiebt, fuehrt fremden
# Code in unserer CI aus, mit unserem GITHUB_TOKEN. Der `# vX.Y.Z`-Kommentar
# dahinter ist nur Lesehilfe fuer Menschen; verbindlich ist der SHA.
# Wie man einen SHA sauber ermittelt (nie abschreiben, immer aufloesen):
#   gh api repos/<owner>/<repo>/git/matching-refs/tags/<tag> \
#     --jq '.[] | "\(.ref) \(.object.sha)"'
# Details + Update-Verfahren: docs/foundation/supply-chain.md

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r litellm/requirements-guardrail.txt -r test/requirements.txt
      # -s ./test statt -s test: aus einem anderen Arbeitsverzeichnis
      # sammelt "-s test" sonst stillschweigend die Python-Stdlib-Suite
      # namens "test" ein (falsch-gruenes Gate, siehe DATENSCHLE-62). Mit
      # ./test schlaegt der Aufruf fehl statt falsch gruen zu werden, wenn
      # das Arbeitsverzeichnis mal nicht das Repo-Root ist.
      - run: python3 -m unittest discover -s ./test -p "test_*.py"

  syntax-check:
    name: syntax-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Kein Linter (ruff/flake8/...) festgelegt -- das ist eine
      # Tech-Stack-Entscheidung fuer docs/foundation/techstack.md, die Oliver
      # trifft, keine stillschweigende Wahl im CI-Workflow. Bis dahin nur ein
      # Syntax-Check ohne neue Dependency: prueft, dass jede Datei parst.
      - run: python3 -m compileall -q litellm test presidio

  # Der `security`-Job ist bewusst EIN Job und heisst weiterhin exakt
  # "security": das Ruleset-Template (.github/ruleset-main-protection.json,
  # DATENSCHLE-61) listet diesen Namen als required Status-Check. Ein neuer
  # Job-Name haette dort mitgepflegt werden muessen -- siehe die Pflege-Regel
  # in docs/BRANCH-PROTECTION.md. So waechst die Abdeckung (Secrets + CVEs),
  # ohne dass sich der Check-Name aendert.
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Faellt frueh und billig: kein Image ohne Digest, und keine Drift
      # zwischen den gepinnten Images und der Scan-Matrix in image-scan.yml.
      # Eine vergessene Matrix-Zeile heisst: der woechentliche CVE-Scan
      # prueft ein Image, das wir gar nicht mehr ausliefern, und meldet
      # beruhigend gruen. Das ist schlimmer als kein Scan.
      - name: Image-Pins pruefen (Digest vorhanden + Scan-Matrix aktuell)
        run: python3 test/check_image_pins.py

      - name: gitleaks (Secrets-Scan)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- CVE-Scan der Python-Abhaengigkeiten (DATENSCHLE-59) ------------
      #
      # WARUM nicht direkt requirements-guardrail.txt scannen: die Datei
      # enthaelt Bereiche (`httpx>=0.27,<1.0`), keine exakten Pins. Ein
      # Scanner kann aus einem Bereich nicht ableiten, welche Version
      # tatsaechlich installiert wird -- er meldet dann nichts und wiegt uns
      # in Sicherheit. Also loesen wir erst auf (pip install + pip freeze) und
      # scannen DAS, was wirklich installiert wuerde.
      #
      # Das ist ein Ersatz, kein Lockfile. Ein echtes Lockfile fehlt weiterhin
      # (Gesetz 5) -- eigenes Work Item, siehe docs/foundation/supply-chain.md §4.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Abhaengigkeiten aufloesen (Scan-Input)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/dsvenv"
          "$RUNNER_TEMP/dsvenv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/dsvenv/bin/pip" install --quiet \
            -r litellm/requirements-guardrail.txt -r test/requirements.txt
          mkdir -p "$RUNNER_TEMP/depscan"
          "$RUNNER_TEMP/dsvenv/bin/pip" freeze > "$RUNNER_TEMP/depscan/requirements.txt"
          echo "::group::Aufgeloeste Versionen (genau das wird gescannt)"
          cat "$RUNNER_TEMP/depscan/requirements.txt"
          echo "::endgroup::"

      # Schritt 1: vollstaendiger Bericht, NIE blockierend (exit-code 0).
      # Zweck: Sichtbarkeit. Auch MEDIUM/LOW und Funde ohne Fix stehen im Log,
      # damit niemand behaupten kann, wir haetten sie nicht gesehen.
      - name: Trivy Dependencies -- vollstaendiger Bericht (nur Meldung)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/depscan
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
          exit-code: "0"
          cache: true

      # Schritt 1b: SARIF erzeugen und hochladen -- VOR dem Gate (MEDIUM-4).
      #
      # Die Reihenfolge ist der ganze Punkt: Schritt 2 beendet den Job mit
      # exit-code 1, danach laeuft nichts mehr. Stuende der Upload dahinter,
      # wuerde ausgerechnet der blockierende Fund NICHT im Security-Tab landen
      # -- aufgezeichnet waeren nur die harmlosen Laeufe.
      #
      # Ohne das hier existieren die Funde nur als Tabelle im Job-Log, und
      # GitHub loescht Job-Logs nach 90 Tagen.
      - name: Trivy Dependencies -- SARIF erzeugen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/depscan
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-deps.sarif
          exit-code: "0"
          trivyignores: .trivyignore.yaml
          cache: true
          skip-setup-trivy: true

      # Forks haben kein `security-events: write` -- ohne diese Bedingung
      # scheiterte jeder Fork-PR an einem Upload, nicht an seiner Qualitaet.
      - name: SARIF ins Code-Scanning hochladen
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-deps.sarif
          category: dependencies

      # Schritt 2: das Gate. Blockiert bei CRITICAL/HIGH -- aber nur, wenn es
      # einen Fix gibt (`ignore-unfixed`).
      #
      # WARUM diese Schwelle (bewusst gewaehlt, siehe supply-chain.md §3):
      # Ein Scanner, der bei jedem neuen CVE rot wird, blockiert irgendwann
      # jeden PR und wird abgeschaltet -- das waere schlechter als kein
      # Scanner. Blockiert wird deshalb nur, was der PR-Autor auch beheben
      # KANN: CRITICAL/HIGH mit verfuegbarem Fix -> Version hochziehen.
      # Alles ohne Fix und alles unter HIGH steht in Schritt 1 im Bericht.
      - name: Trivy Dependencies -- Gate (CRITICAL/HIGH mit verfuegbarem Fix)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/depscan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          cache: true
          skip-setup-trivy: true

  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Laufzettel pruefen (SHA-gepinnte Verdicts)
        env:
          BASE_REF: ${{ github.base_ref }}
          # Die echte PR-Spitze. HEAD ist hier der von GitHub fabrizierte
          # Probe-Merge refs/pull/N/merge, nicht der auditierte Stand.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-laufzettel.sh
