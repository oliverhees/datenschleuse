# Image-CVE-Scan (DATENSCHLE-59)
#
# WARUM eine eigene Workflow-Datei statt eines Jobs in ci.yml:
#
#  1. Laufzeit. Die gepinnten Basis-Images sind zusammen mehrere Gigabyte.
#     Das bei jedem PR zu ziehen, waere Minuten Wartezeit fuer eine Aenderung,
#     die mit den Images nichts zu tun hat.
#  2. Ausloeser. Ein Image-CVE entsteht nicht durch unseren PR, sondern durch
#     eine Veroeffentlichung irgendwo auf der Welt. Der richtige Takt ist
#     deshalb "woechentlich" plus "immer, wenn wir einen Pin anfassen" --
#     nicht "bei jedem Commit".
#  3. Deadlock-Schutz. Dieser Workflow hat einen `paths`-Filter. Ein
#     paths-gefilterter Job als REQUIRED Status-Check waere toedlich: bei PRs
#     ohne passende Pfade meldet er nie ein Ergebnis, und GitHub wartet
#     ewig -- kein PR mehr mergebar (genau die Falle, vor der
#     docs/BRANCH-PROTECTION.md warnt). Als eigener Workflow steht er
#     bewusst NICHT auf der Required-Liste.
#
# Dieser Workflow BLOCKIERT NICHTS -- er meldet. Warum, steht ausfuehrlich
# an Schritt 2 unten und in docs/foundation/supply-chain.md §3: Die
# Presidio-Images bringen CRITICALs mit, fuer die es bei Microsoft keinen
# neueren Stand gibt. Ein Gate, das niemand erfuellen kann, wird abgeschaltet.
# Die Merge-Sperre sitzt beim Dependency-Scan im `security`-Job von ci.yml.

name: image-scan

on:
  schedule:
    # Montags 05:17 UTC. Krumme Minute mit Absicht: zur vollen Stunde ist die
    # GitHub-Scheduler-Queue am vollsten und Laeufe verzoegern sich.
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "litellm/Dockerfile"
      - "presidio/Dockerfile.analyzer"
      - "docker-compose.yml"
      # Der Coolify-Deploy ist der Weg, auf dem die gehostete Instanz laeuft.
      # Er fehlte hier ebenso wie im Pin-Check (DATENSCHLE-59, HIGH-2).
      - "deploy/coolify/docker-compose.yaml"
      - ".trivyignore.yaml"
      - ".github/workflows/image-scan.yml"

permissions:
  contents: read
  # Fuer den SARIF-Upload ins Code-Scanning (DATENSCHLE-59, Audit-Fund MEDIUM-4).
  # Bewusst nur hier und nur dieses eine zusaetzliche Recht.
  security-events: write

jobs:
  scan:
    name: image-scan (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Ein Image pro Runner: jedes bekommt seine eigenen ~14 GB Plattenplatz.
      # Alle fuenf nacheinander auf einem Runner haette die Platte gefuellt.
      fail-fast: false
      matrix:
        include:
          - name: litellm
            ref: ghcr.io/berriai/litellm:v1.97.0@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834
          - name: presidio-analyzer
            ref: mcr.microsoft.com/presidio-analyzer:2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
          - name: presidio-anonymizer
            ref: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
          - name: presidio-image-redactor
            ref: mcr.microsoft.com/presidio-image-redactor:0.0.58@sha256:e49fd47bfc38d834f0856063b9f00cfb3c19866e8d61b061849baf6275139612
          - name: postgres
            ref: postgres:16.15-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Schritt 1: vollstaendiger Bericht, nie blockierend.
      # HIGH/MEDIUM/LOW und alles ohne Fix landet hier im Log. Sichtbar, aber
      # ohne Merge-Sperre.
      - name: Trivy ${{ matrix.name }} -- vollstaendiger Bericht (nur Meldung)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.ref }}
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
          timeout: "20m"
          cache: true

      # Schritt 2: separater CRITICAL-Auszug -- BEWUSST NICHT BLOCKIEREND.
      #
      # Erster Entwurf hatte hier `exit-code: 1` (CRITICAL + `ignore-unfixed`).
      # Der allererste echte Lauf (Run 32252889633, 2026-08-19) hat gezeigt,
      # dass diese Schwelle heute unerfuellbar ist:
      #
      #   litellm v1.97.0                 0 CRITICAL  -> gruen
      #   postgres 16.15-alpine           1 CRITICAL  (CVE-2025-68121, Go-stdlib)
      #   presidio-analyzer 2.2.362       9 CRITICAL  (openssl, gnutls, perl)
      #   presidio-anonymizer 2.2.362     9 CRITICAL  (dieselben)
      #   presidio-image-redactor 0.0.58  CRITICAL vorhanden
      #
      # Entscheidend ist nicht die Zahl, sondern die Handhabbarkeit: Die
      # Presidio-Images sind Debian-basiert, und 2.2.362 IST der neueste
      # Stand von Microsoft. "In Debian gefixt" heisst nicht "von uns
      # behebbar" -- den Fix muss Microsoft in einen Rebuild giessen. Es gibt
      # keinen Digest, auf den wir hochziehen koennten.
      #
      # Ein blockierender Check, den niemand erfuellen KANN, ist genau der
      # Mechanismus, durch den Scanner abgeschaltet werden. Deshalb meldet
      # dieser Workflow, statt zu blockieren. Die Merge-Sperre sitzt dort, wo
      # sie handhabbar ist: beim Dependency-Gate im `security`-Job (dort ist
      # der Fix eine Zeile "Version hochziehen").
      #
      # Der Zweck dieses Schritts bleibt: den CRITICAL-Auszug getrennt vom
      # 200-Zeilen-Gesamtbericht sichtbar machen, damit die woechentliche
      # Ausgabe lesbar ist und eine Veraenderung auffaellt.
      #
      # WIEDER SCHARF SCHALTEN (`exit-code: "1"`), sobald der Presidio-
      # Altbestand entschieden ist -- Oliver-Entscheidung, siehe
      # docs/foundation/supply-chain.md §3 "Der Presidio-Altbestand".
      - name: Trivy ${{ matrix.name }} -- CRITICAL-Auszug (nur Meldung)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.ref }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore.yaml
          timeout: "20m"
          cache: true
          skip-setup-trivy: true

      # Schritt 3: SARIF ins Code-Scanning hochladen (Audit-Fund MEDIUM-4).
      #
      # WARUM: Schritt 1 und 2 schreiben eine Tabelle ins Job-Log -- sonst
      # nichts. Kein Artefakt, keine Benachrichtigung. Der woechentliche Lauf
      # endet mit fuenf gruenen Haken, obwohl darunter tausende Funde liegen.
      # Ein gruener Haken ueber 3847 Befunden ist kein neutrales, sondern ein
      # aktiv irrefuehrendes Signal. Und GitHub loescht Job-Logs nach 90 Tagen:
      # Wer im Januar wissen will, was wir im August ausgeliefert haben, findet
      # nichts mehr.
      #
      # Das Repo ist public, damit ist Code-Scanning kostenlos. Die Funde landen
      # dedupliziert und historisiert im Security-Tab, mit Verlauf pro CVE --
      # "seit wann haben wir das?" wird damit beantwortbar.
      #
      # `category` ist bei einer Matrix PFLICHT: ohne sie ueberschreiben sich
      # die fuenf Matrix-Jobs gegenseitig und es bliebe genau ein Image uebrig.
      - name: Trivy ${{ matrix.name }} -- SARIF erzeugen
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.ref }}
          scanners: vuln
          severity: CRITICAL,HIGH,MEDIUM
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "0"
          trivyignores: .trivyignore.yaml
          timeout: "20m"
          cache: true
          skip-setup-trivy: true

      # Forks haben kein `security-events: write`. Ohne diese Bedingung wuerde
      # jeder Fork-PR mit einem roten Upload-Schritt enden -- ein Fehlschlag,
      # der nichts ueber die Sicherheit des PRs aussagt.
      - name: SARIF ins Code-Scanning hochladen
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: image-${{ matrix.name }}
