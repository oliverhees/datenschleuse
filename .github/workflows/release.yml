# Release: test, build both images for linux/amd64 and linux/arm64, smoke-test
# the pushed bytes, then tag them on GHCR.
#
# Images (docs/DEPLOY.md, "Fertige Images"):
#   ghcr.io/oliverhees/datenschleuse            proxy  (litellm/Dockerfile)
#   ghcr.io/oliverhees/datenschleuse-analyzer   analyzer, de_core_news_lg
#   ghcr.io/oliverhees/datenschleuse-analyzer   tag suffix -md: de_core_news_md
#
# Flow:
#   1. version  - version from the tag (v1.2.3 -> 1.2.3); manual start: sha-<commit>.
#                 REFUSES (the whole run stops) unless the commit is on main;
#                 a manual start is only accepted from the main branch or a tag.
#   2. test     - the unit suite and the pin check, exactly as in ci.yml.
#   3. approve  - environment `release`: a person with the required-reviewer
#                 role confirms before anything is pushed to the registry.
#   4. build-*  - per platform on a native runner, with provenance (mode=max)
#                 and SBOM attestations, pushed BY DIGEST ONLY (no tag yet).
#   5. smoke    - pulls the amd64 digests and runs test/smoke-images.sh:
#                 read-only, non-root, analyzer without network, block contract.
#   6. scan     - Trivy on the pushed digests of both platforms; fixable
#                 CRITICAL/HIGH findings stop the release (.trivyignore.yaml
#                 rules apply).
#   7. publish  - environment `release` again; only after a green smoke test and
#                 a clean scan: both platforms under one tag per image; digests
#                 in the job summary.
#
# Tags: <version> always (plus <version>-md for the md analyzer). `latest`
# (and `latest-md`) only for a pushed tag v<major>.<minor>.<patch> WITHOUT a
# pre-release suffix -- never on a manual start. Every release commit is on
# main (step 1).
#
# The environment `release` (required reviewers) and the protection rule for
# tags `v*` are repository settings the owner creates; they cannot be set from
# this file. Without the environment the jobs run without a pause. See
# docs/BRANCH-PROTECTION.md, section "Release".
#
# Permissions: contents: read for the whole workflow; packages: write only in
# the jobs that push (build-*, publish), packages: read in smoke and scan. No secret
# except the run's GITHUB_TOKEN.
#
# SUPPLY-CHAIN RULE (DATENSCHLE-59, see ci.yml): every `uses:` is pinned to a
# commit SHA. Only the two actions this repository already pins are used; the
# rest is plain shell with docker buildx.
#
# A newly created GHCR package is PRIVATE. After the first release its
# visibility has to be set to public once in the package settings, otherwise
# `docker pull` without login fails for users.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PROXY_IMAGE: ghcr.io/oliverhees/datenschleuse
  ANALYZER_IMAGE: ghcr.io/oliverhees/datenschleuse-analyzer
  # Fixed BuildKit version for builds with attestations.
  BUILDKIT_IMAGE: moby/buildkit:v0.31.1@sha256:6b59b7df63a8cb9902736f9ddf7fcff8261613d3e7449b8ea8b7537fc399c03a

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      latest: ${{ steps.v.outputs.latest }}
    steps:
      # Full history: needed to check whether the tagged commit is on main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          latest=false
          # A manual start is only accepted from the default branch (or a tag).
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$REF_TYPE" = "branch" ] \
            && [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Manual start only from $DEFAULT_BRANCH (got branch $REF_NAME)." >&2
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "Tag $REF_NAME is not of the form v<major>.<minor>.<patch>[-<pre>]." >&2
              exit 1
            fi
            version=${REF_NAME#v}
            case "$version" in
              *-*) ;;
              *) [ "$EVENT" = "push" ] && latest=true ;;
            esac
          else
            version="sha-$(printf '%s' "$COMMIT" | cut -c1-12)"
          fi
          # Nothing is published from a commit that is not on the default
          # branch (finding M1): no version tag, no sha- tag, no `latest` tag.
          if ! git merge-base --is-ancestor "$COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "Commit $COMMIT is not on $DEFAULT_BRANCH: refusing to release." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Version: $version (latest: $latest)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -r litellm/requirements-guardrail.txt -r test/requirements.txt
      # Same invocation as ci.yml (./test, not test -- DATENSCHLE-62).
      - run: python3 -m unittest discover -s ./test -p "test_*.py"
      - run: python3 -m compileall -q litellm test presidio
      - run: python3 test/check_image_pins.py

  # Approval gate before anything is pushed to the registry. The job does
  # nothing itself; the environment's required reviewers are the control.
  approve:
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - run: echo "Release approved for $VERSION (commit $GITHUB_SHA)."
        env:
          VERSION: ${{ needs.version.outputs.version }}

  build-amd64:
    needs: [version, test, approve]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      proxy: ${{ steps.build.outputs.proxy }}
      analyzer: ${{ steps.build.outputs.analyzer }}
      analyzer_md: ${{ steps.build.outputs.analyzer_md }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: build
        name: Build and push by digest
        env:
          PLATFORM: linux/amd64
          VERSION: ${{ needs.version.outputs.version }}
        run: sh .github/scripts/release-build.sh
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  build-arm64:
    needs: [version, test, approve]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      proxy: ${{ steps.build.outputs.proxy }}
      analyzer: ${{ steps.build.outputs.analyzer }}
      analyzer_md: ${{ steps.build.outputs.analyzer_md }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: build
        name: Build and push by digest
        env:
          PLATFORM: linux/arm64
          VERSION: ${{ needs.version.outputs.version }}
        run: sh .github/scripts/release-build.sh
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  smoke:
    needs: [build-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Log in to GHCR (read)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Smoke test the pushed amd64 images (lg and md analyzer)
        env:
          PROXY_DIGEST: ${{ needs.build-amd64.outputs.proxy }}
          ANALYZER_DIGEST: ${{ needs.build-amd64.outputs.analyzer }}
          ANALYZER_MD_DIGEST: ${{ needs.build-amd64.outputs.analyzer_md }}
        run: |
          set -eu
          PROXY_IMAGE="$PROXY_IMAGE@$PROXY_DIGEST" ANALYZER_IMAGE="$ANALYZER_IMAGE@$ANALYZER_DIGEST" \
            sh test/smoke-images.sh
          PROXY_IMAGE="$PROXY_IMAGE@$PROXY_DIGEST" ANALYZER_IMAGE="$ANALYZER_IMAGE@$ANALYZER_MD_DIGEST" \
            sh test/smoke-images.sh
      - name: Log out
        if: always()
        run: docker logout ghcr.io

  # Scan the pushed (still untagged) digests of both platforms. Fixable
  # CRITICAL/HIGH findings stop the release; unfixed ones and everything below
  # HIGH stay with the weekly image-scan.yml report (same threshold as the
  # dependency gate in ci.yml, same ignore file and rules).
  scan:
    name: scan (${{ matrix.image }} ${{ matrix.platform }})
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: proxy
            platform: linux/amd64
            ref: ${{ format('ghcr.io/oliverhees/datenschleuse@{0}', needs.build-amd64.outputs.proxy) }}
          - image: proxy
            platform: linux/arm64
            ref: ${{ format('ghcr.io/oliverhees/datenschleuse@{0}', needs.build-arm64.outputs.proxy) }}
          - image: analyzer
            platform: linux/amd64
            ref: ${{ format('ghcr.io/oliverhees/datenschleuse-analyzer@{0}', needs.build-amd64.outputs.analyzer) }}
          - image: analyzer
            platform: linux/arm64
            ref: ${{ format('ghcr.io/oliverhees/datenschleuse-analyzer@{0}', needs.build-arm64.outputs.analyzer) }}
          - image: analyzer_md
            platform: linux/amd64
            ref: ${{ format('ghcr.io/oliverhees/datenschleuse-analyzer@{0}', needs.build-amd64.outputs.analyzer_md) }}
          - image: analyzer_md
            platform: linux/arm64
            ref: ${{ format('ghcr.io/oliverhees/datenschleuse-analyzer@{0}', needs.build-arm64.outputs.analyzer_md) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Trivy, fixable CRITICAL/HIGH stop the release
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # The package is private until its first release; read access via
          # the run's token. TRIVY_PLATFORM picks the arm64 manifest on the
          # amd64 runner.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          scan-type: image
          image-ref: ${{ matrix.ref }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          timeout: "20m"
          cache: true

  publish:
    needs: [version, build-amd64, build-arm64, smoke, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Merge platforms under the version tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
          LATEST: ${{ needs.version.outputs.latest }}
          P_AMD: ${{ needs.build-amd64.outputs.proxy }}
          P_ARM: ${{ needs.build-arm64.outputs.proxy }}
          A_AMD: ${{ needs.build-amd64.outputs.analyzer }}
          A_ARM: ${{ needs.build-arm64.outputs.analyzer }}
          M_AMD: ${{ needs.build-amd64.outputs.analyzer_md }}
          M_ARM: ${{ needs.build-arm64.outputs.analyzer_md }}
        run: |
          set -eu
          publish() {
            image=$1 tag=$2 latest_tag=$3 amd=$4 arm=$5 description=$6
            tags="--tag $image:$tag"
            if [ "$LATEST" = "true" ]; then tags="$tags --tag $image:$latest_tag"; fi
            # shellcheck disable=SC2086
            docker buildx imagetools create $tags \
              --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
              --annotation "index:org.opencontainers.image.description=$description" \
              "$image@$amd" "$image@$arm"
            digest=$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "invalid digest: $digest" >&2; exit 1; }
            echo "| \`$image:$tag\` | \`$digest\` | \`$amd\` | \`$arm\` |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "## Datenschleuse $VERSION"
            echo
            echo "Commit \`$GITHUB_SHA\`, latest: $LATEST"
            echo
            echo "| Image | Digest (both platforms) | linux/amd64 | linux/arm64 |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          publish "$PROXY_IMAGE" "$VERSION" latest "$P_AMD" "$P_ARM" \
            "Datenschleuse proxy: LiteLLM with the Datenschleuse guardrail"
          publish "$ANALYZER_IMAGE" "$VERSION" latest "$A_AMD" "$A_ARM" \
            "Datenschleuse analyzer: Presidio with German recognizers, de_core_news_lg"
          publish "$ANALYZER_IMAGE" "$VERSION-md" latest-md "$M_AMD" "$M_ARM" \
            "Datenschleuse analyzer: Presidio with German recognizers, de_core_news_md"
          {
            echo
            echo "Pin by digest, e.g. \`image: $PROXY_IMAGE:$VERSION@sha256:...\` (docs/DEPLOY.md)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
