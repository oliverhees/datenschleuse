  # NEGATIV — spaCy-NER-Fehlzuendungen auf deutschen Alltagswoertern
  #
  # Herkunft: alle Faelle unten sind GEMESSENE Treffer des laufenden
  # Analyzers (de_core_news_lg, Score 0.85), nicht vermutete. Sie decken die
  # Luecke, die negativ-001..006 offen liessen: jene sechs Koeder zielen
  # ausschliesslich auf die Regex-Recognizer (IBAN-, Telefon-, KFZ-,
  # Aktenzeichen-, Firmen-Muster). Die statistische NER-Seite war komplett
  # unbeprobt -- deshalb meldete der Benchmark 100% Precision, waehrend
  # DATENSCHLE-70 und -71 in Produktion sichtbar falsch lagen.
  # ---------------------------------------------------------------------

  # --- DATENSCHLE-70: ASCII-Umschrift (ae/oe/ue/ss) ---
  #
  # Warum das zaehlt: ASCII-Umschrift ist in Formularen, CLIs, Altsystemen
  # und Exportdateien verbreitet -- also genau in den Datenbestaenden, die
  # durch die Datenschleuse laufen. Das spaCy-Modell hat diese Schreibweise
  # kaum gesehen und deutet unbekannte grossgeschriebene Tokens als Name.

  - id: negativ-007-ascii-imperativ-aendere
    text: "Aendere keinen einzigen Wert."
    entities: []

