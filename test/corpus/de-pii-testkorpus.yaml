# Datenschleuse — Deutscher PII-Testkorpus (ISC-35, v1-Gate)
#
# Ground-Truth-Korpus zur Messung von Recall/Precision der Presidio-Erkennung
# (Standard-Recognizer + eigene deutsche Custom-Recognizer aus
# presidio/recognizers-config.yml). Jeder Fall listet den Text plus die
# exakten Teilstrings, die als PII erkannt werden MÜSSEN (Ground Truth).
#
# Format: `value` ist der exakte Teilstring aus `text` (kein Regex). Der
# Benchmark-Runner sucht ihn per str.find() im Text und vergleicht die
# gefundene Position mit den von Presidio zurückgelieferten Entity-Spans.
#
# `expected_recall`: bei bekannten Erkennungslücken (z.B. Quasi-Identifier,
# noch kein eigener Recognizer) auf "known_gap" gesetzt statt "must_detect" --
# der Benchmark zählt das getrennt aus (zeigt den Fortschritt über die Zeit,
# statt den Score künstlich zu drücken oder zu beschönigen).
#
# Pflicht-Konvention (CLAUDE.md): jede neue deutsche Entität braucht
# Recognizer + Testfall + Benchmark-Eintrag zusammen. Dieser Korpus ist der
# Testfall-Teil davon.

#
# =========================================================================
# KORPUS v2 (DATENSCHLE-94) -- Haertung
# =========================================================================
# Der Korpus hat zwei Teile:
#   * v1: die ersten 84 Faelle (ohne `category`). Unveraendert, nur
#     Basis-Schema. Sie sind fokussiert annotiert (nicht jede PII im Text).
#   * v2: alle Faelle mit `category` und id-Praefix `v2-`. Streng validiert
#     (Loader: test/corpus-benchmark.py::_validate_case_rules) und nach den
#     Regeln A1-A6 unten annotiert. Alle Texte sind synthetisch.
#
# Zusatzfelder (nur v2):
#   category  Fehlerklasse des Falls (z.B. nachname-wort, negativ-satzanfang).
#   split     `dev` (darf zum Abstimmen von Wortlisten/Recognizern dienen) oder
#             `holdout`. Der Hold-out darf NIE zum Tunen benutzt werden:
#             Tuning-Laeufe fahren mit `--split dev`, der Hold-out wird
#             getrennt ausgewiesen. Neue Hold-out-Faelle brauchen frisches
#             Vokabular, keine Varianten bereits abgestimmter Woerter.
#   control   true = Positiv-Kontrolle. Jede must_detect-Entitaet traegt dann
#             `baseline_detected` (true/false): ob die Baseline (current main
#             bei der Korpus-Haertung, siehe benchmark-results.json) sie
#             gemessen erkannt hat. Weicht ein Lauf davon ab, weist der Report
#             das aus (Rueckschritt bzw. Fortschritt).
#
# ANNOTATIONSREGELN
#   A1 Span-Minimalitaet. `value` ist genau der identifizierende String, wie
#      im Text geschrieben: ohne Anrede/Titel/Rolle/Label (kein "Herr",
#      "Dr."), ohne Rand-Satzzeichen, ohne Rand-Whitespace. Er kommt im Text
#      genau EINMAL vor (kein geratener Offset) und ueberlappt keinen anderen
#      Span derselben Faelle (Ausnahme: A5). Verschachtelte Namen (Ort im
#      Organisationsnamen) werden als aeusserster Span annotiert.
#   A2 Erschoepfend (v2). In v2-Positivfaellen ist JEDE PII der unterstuetzten
#      Typen annotiert (must_detect oder known_gap); was nicht annotiert ist,
#      ist per Definition keine PII. Berufs-/Rollenbezeichnungen ohne Namen
#      sind keine PII. Die Precision bleibt trotzdem allein aus den
#      Negativfaellen berechnet (Metrik-Semantik unveraendert).
#   A3 Nicht-PII (Negativfaelle, `entities: []`). Satzinitial grossgeschriebene
#      Verben und Substantive (Fasse, Uebersetze, Rueckruf), deutsche
#      Schema-Schluessel und Labels, Produkt-/Werkzeugnamen und generische
#      Rollenwoerter ohne Namen sind nie PII -- in ASCII- und Umlaut-
#      Schreibweise gleichermassen. Ein Negativtext enthaelt keinen einzigen
#      Eigennamen (Person, Ort, Organisation) und keine Kennung.
#   A4 Mehrdeutige Nachnamen. Ein Nachname, der zugleich Alltagswort ist
#      (Menge, Fuege, Koch, Bauer), ist PII, wenn der Kontext ihn als Namen
#      markiert (Anrede, Vorname, Rolle+Name, "Name:"-Label, Signatur,
#      Schluessel wie "nachname"). Ohne erkennbaren Marker wird NICHT geraten:
#      der Fall kommt gar nicht erst in den Korpus. Nachnamen mit
#      Kopf-Morphemen (Erhart, Lienhart) sind Recall-Waechter (DATENSCHLE-101).
#   A5 Quasi-Identifier und Dateinamen. Die beschreibende Kombination
#      ("der Geschaeftsfuehrer von X in Y") wird als QUASI_IDENTIFIER_COMBO
#      annotiert und ist known_gap (nur berichtet, nicht gewertet). Die darin
#      vorkommenden Eigennamen (Firma, Ort) werden zusaetzlich einzeln und als
#      must_detect annotiert -- nur hier duerfen sich Spans ueberlappen.
#      Ein Titel in Dateinamen-Form (Arztbrief_Mustermann.pdf, DATENSCHLE-98)
#      ist known_gap, solange keine Erkennung dafuer existiert. Strassen ohne
#      Suffix-Wort ("Am Muehlenteich 5") sind ebenfalls known_gap (dokumentierte
#      Grenze von DE_STRASSE).
#   A6 Nur Synthetisches. Alle Namen, Firmen, Adressen und Kennungen sind
#      erfunden; keine realen Personen, keine Personen des oeffentlichen
#      Lebens. E-Mail-Adressen liegen ausschliesslich auf reservierten Domains
#      (RFC 2606: example.com/.org/.net/.de). Die nackte TLD `.example` ist
#      bewusst NICHT verwendet: Presidios EmailRecognizer validiert die TLD
#      (tldextract), `x@y.example` wird nie erkannt -- der Fall wuerde den
#      Validator messen statt die Erkennung. Telefonnummern, IBAN, Steuer-ID
#      und Kartennummern sind Dokumentations-/Testwerte.
#
# HOLD-OUT-DISJUNKTHEIT (test_corpus_v2.py::HoldoutDisjointTest): Kein Token
# einer PERSON-, LOCATION-, ORGANIZATION- oder DE_FIRMA-Entitaet im Hold-out
# darf in einer dev-Entitaet (v1 zaehlt zu dev) oder unter den gross
# geschriebenen Woertern eines dev-QUASI_IDENTIFIER_COMBO-Spans vorkommen --
# typuebergreifend. Dazu drei Variantenregeln: (1) Stammregel (Tokens ab 4
# Zeichen: Praefix des anderen oder >= 5 gemeinsame Praefix-Zeichen, nach
# Umlaut-Faltung ae/oe/ue/ss), (2) Editierdistanz <= 1 (Tokens ab 6 Zeichen),
# (3) -hart/-hardt/-hard bilden EINE Familie. Ausgenommen: Rechtsform-Tokens,
# Zahlen/Datum, reine Kennungen; nicht geprueft: gross geschriebene
# Nicht-Anfangswoerter in Negativ-Texten und Berufsbezeichnungen. Eine
# kleine, begruendete Ausnahmeliste existiert und ist leer.
#
# NO-SHRINK: corpus-manifest.json haelt alle ids samt Split fest, dazu je
# v1-Fall einen Inhalts-Hash;
# test/test_corpus_v2.py vergleicht in beide Richtungen und prueft absolute
# Untergrenzen. Ein Fall verschwindet nur durch eine sichtbare Aenderung.

cases:
  # ---------------------------------------------------------------------
  # PERSON
  # ---------------------------------------------------------------------
  - id: person-001-formal
    text: >-
      Sehr geehrter Herr Dr. Michael Bergmann, vielen Dank für Ihre Anfrage
      vom 12. März.
    entities:
      - type: PERSON
        value: "Michael Bergmann"
        expected_recall: must_detect

  - id: person-002-vorname-nachname-mitten-im-satz
    text: >-
      Die Rückfrage kam heute von Anna-Lena Schweitzer, die sich über den
      Lieferverzug beschwert hat.
    entities:
      - type: PERSON
        value: "Anna-Lena Schweitzer"
        expected_recall: must_detect

  - id: person-003-zwei-personen
    text: >-
      Das Meeting zwischen Thomas Reinhardt und Fatima Al-Sayed wurde auf
      Donnerstag verschoben.
    entities:
      - type: PERSON
        value: "Thomas Reinhardt"
        expected_recall: must_detect
      - type: PERSON
        value: "Fatima Al-Sayed"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # EMAIL_ADDRESS
  # ---------------------------------------------------------------------
  - id: email-001-standard
    text: >-
      Bitte antworten Sie direkt an michael.bergmann@dieselwerke-koeln.de,
      damit die Buchhaltung informiert ist.
    entities:
      - type: EMAIL_ADDRESS
        value: "michael.bergmann@dieselwerke-koeln.de"
        expected_recall: must_detect

  - id: email-002-mit-plus-alias
    text: >-
      Die Bestellbestätigung ging an support+bestellung.9214@webshop-nord.de
      raus, bisher keine Reaktion.
    entities:
      - type: EMAIL_ADDRESS
        value: "support+bestellung.9214@webshop-nord.de"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # PHONE_NUMBER
  # ---------------------------------------------------------------------
  - id: phone-001-festnetz
    text: >-
      Rückruf bitte unter 0221 4587632, am besten nachmittags.
    entities:
      - type: PHONE_NUMBER
        value: "0221 4587632"
        expected_recall: must_detect

  - id: phone-002-mobil-international
    text: >-
      Erreichbar bin ich auch mobil unter +49 172 3344556, falls es
      dringend ist.
    entities:
      - type: PHONE_NUMBER
        value: "+49 172 3344556"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # LOCATION
  # ---------------------------------------------------------------------
  - id: location-001-adresse
    text: >-
      Die Ware soll an die Lagerhausstraße 14, 50667 Köln geliefert werden.
    entities:
      - type: LOCATION
        value: "Lagerhausstraße 14"
        expected_recall: must_detect

  - id: location-002-stadt-allein
    text: >-
      Frau Vogt zieht nächsten Monat von Leipzig nach Freiburg im Breisgau.
    entities:
      - type: LOCATION
        value: "Leipzig"
        expected_recall: must_detect
      - type: LOCATION
        value: "Freiburg im Breisgau"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # CREDIT_CARD
  # ---------------------------------------------------------------------
  - id: creditcard-001-visa
    text: >-
      Die Zahlung wurde mit der Karte 4532 0151 1283 0366 abgewickelt.
    entities:
      - type: CREDIT_CARD
        value: "4532 0151 1283 0366"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # IBAN_CODE
  # ---------------------------------------------------------------------
  - id: iban-001-standard
    text: >-
      Bitte überweisen Sie den Betrag auf DE89 3704 0044 0532 0130 00.
    entities:
      - type: IBAN_CODE
        value: "DE89 3704 0044 0532 0130 00"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # IP_ADDRESS
  # ---------------------------------------------------------------------
  - id: ip-001-ipv4
    text: >-
      Im Server-Log taucht wiederholt die Adresse 192.168.87.204 mit
      fehlgeschlagenen Login-Versuchen auf.
    entities:
      - type: IP_ADDRESS
        value: "192.168.87.204"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # DE_STEUER_ID (eigener Recognizer)
  # ---------------------------------------------------------------------
  - id: de-steuer-001-mit-kontext
    text: >-
      Für den Lohnsteuerjahresausgleich benötigen wir Ihre
      Steueridentifikationsnummer 12 345 678 901.
    entities:
      - type: DE_STEUER_ID
        value: "12 345 678 901"
        expected_recall: must_detect

  - id: de-steuer-002-ohne-leerzeichen
    text: >-
      Die IdNr des Antragstellers lautet 65441234567, bitte im Formular
      ergänzen.
    entities:
      - type: DE_STEUER_ID
        value: "65441234567"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # DE_SOZIALVERSICHERUNG (eigener Recognizer)
  # ---------------------------------------------------------------------
  - id: de-sv-001-standard
    text: >-
      Die Sozialversicherungsnummer für die Anmeldung lautet
      65 220195 M 123.
    entities:
      - type: DE_SOZIALVERSICHERUNG
        value: "65 220195 M 123"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # DE_HANDELSREGISTER (eigener Recognizer)
  # ---------------------------------------------------------------------
  - id: de-hr-001-hrb
    text: >-
      Die Gesellschaft ist eingetragen beim Amtsgericht Köln unter
      HRB 45231.
    entities:
      - type: DE_HANDELSREGISTER
        value: "HRB 45231"
        expected_recall: must_detect

  - id: de-hr-002-hra
    text: >-
      Der Vertrag verweist auf die im Handelsregister unter HRA 8817
      geführte Einzelfirma.
    entities:
      - type: DE_HANDELSREGISTER
        value: "HRA 8817"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # DE_KFZ_KENNZEICHEN (eigener Recognizer)
  # ---------------------------------------------------------------------
  - id: de-kfz-001-standard
    text: >-
      Der beschädigte Firmenwagen mit dem Kennzeichen B-MM 1234 steht seit
      Montag in der Werkstatt.
    entities:
      - type: DE_KFZ_KENNZEICHEN
        value: "B-MM 1234"
        expected_recall: must_detect

  - id: de-kfz-002-dreistellig
    text: >-
      Vor dem Lager parkt ein Transporter mit dem Kennzeichen K-AB 789,
      wem gehört der?
    entities:
      - type: DE_KFZ_KENNZEICHEN
        value: "K-AB 789"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # QUASI-IDENTIFIER — eigene QI-Recognizer (neue Kategorie, must_detect)
  # Einzeln erkannt via presidio/recognizers-config.yml. Die SESSION-
  # Akkumulation + Generalisierung passiert im Guardrail (litellm/
  # qi_generalization.py + qi_state.py) und wird dort per Unit-Test geprueft
  # -- hier geht es nur um die reine EINZEL-Erkennung durch Presidio.
  # ---------------------------------------------------------------------
  - id: de-qi-plz-001-mit-kontext
    text: >-
      Für den Versand brauche ich noch Ihre Postleitzahl, aktuell steht dort
      84028 im System.
    entities:
      - type: DE_PLZ
        value: "84028"
        expected_recall: must_detect

  - id: de-qi-geburtsjahr-001-jahrgang
    text: >-
      Der Hinweisgeber gibt an, Jahrgang 1979 zu sein und schon lange im
      Betrieb zu arbeiten.
    entities:
      - type: DE_GEBURTSJAHR
        value: "1979"
        expected_recall: must_detect

  # Live-Befund 2026-07-30 (Oliver, Cockpit-Livetest): "geboren am 14.03.1985"
  # wurde von KEINEM Recognizer erfasst -- DE_GEBURTSJAHR verlangt die
  # Jahreszahl direkt hinterm Kontext-Wort, "am" dazwischen bricht den Match.
  # Neuer Recognizer DE_GEBURTSDATUM (presidio/recognizers-config.yml) schliesst
  # die Luecke. Volles Datum statt blosser Jahreszahl -- der staerkere der drei
  # Sweeney-Quasi-Identifier.
  - id: de-qi-geburtsdatum-001-geboren-am
    text: >-
      Herr Bergmann, geboren am 14.03.1985, wohnhaft in München, ist als
      Ingenieur tätig.
    entities:
      - type: DE_GEBURTSDATUM
        value: "14.03.1985"
        expected_recall: must_detect

  - id: de-qi-tvoed-001-entgeltgruppe
    text: >-
      Die neue Kollegin wird nach TVöD E13 vergütet, das ist tariflich so
      hinterlegt.
    entities:
      - type: DE_TVOED_STUFE
        value: "TVöD E13"
        expected_recall: must_detect

  - id: de-qi-tvoed-002-besoldung
    text: >-
      Der Dienstposten ist mit Besoldungsgruppe A13 bewertet, Beamtenverhältnis
      auf Lebenszeit.
    entities:
      - type: DE_TVOED_STUFE
        value: "Besoldungsgruppe A13"
        expected_recall: must_detect

  - id: de-qi-gender-001-meldung
    text: >-
      Im Meldebogen ist als Geschlecht männlich eingetragen, alles Weitere
      bleibt vertraulich.
    entities:
      - type: DE_GENDER
        value: "männlich"
        expected_recall: must_detect

  - id: de-qi-beruf-001-buergermeister
    text: >-
      Die betroffene Person arbeitet als Bürgermeister und möchte deshalb
      unbedingt anonym bleiben.
    entities:
      - type: DE_BERUF
        value: "Bürgermeister"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # DE_AKTENZEICHEN (eigener Recognizer)
  # ---------------------------------------------------------------------
  - id: de-az-001-gericht
    text: >-
      Das Verfahren läuft beim Landgericht unter dem Aktenzeichen 3 O 123/45,
      bitte im Schriftsatz angeben.
    entities:
      - type: DE_AKTENZEICHEN
        value: "3 O 123/45"
        expected_recall: must_detect

  - id: de-az-002-az-kuerzel
    text: >-
      Bitte nennen Sie im Betreff das Az. 5 K 678/23, damit wir die Akte
      zuordnen können.
    entities:
      - type: DE_AKTENZEICHEN
        value: "5 K 678/23"
        expected_recall: must_detect

  - id: de-az-003-bgh-roemisch
    text: >-
      Der Bundesgerichtshof entschied unter VI ZR 200/20 zugunsten der
      Klägerin.
    entities:
      - type: DE_AKTENZEICHEN
        value: "VI ZR 200/20"
        expected_recall: must_detect

  - id: de-az-004-geschaeftszeichen
    text: >-
      Unser Geschäftszeichen lautet Gz. 12-3456.7-8/9, bitte bei Rückfragen
      angeben.
    entities:
      - type: DE_AKTENZEICHEN
        value: "12-3456.7-8/9"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # DE_FIRMA (eigener Recognizer)
  # ---------------------------------------------------------------------
  - id: de-firma-001-gmbh
    text: >-
      Der Rahmenvertrag wurde mit der Mustermann Technik GmbH in Köln
      geschlossen.
    entities:
      - type: DE_FIRMA
        value: "Mustermann Technik GmbH"
        expected_recall: must_detect

  - id: de-firma-002-gmbh-co-kg
    text: >-
      Die Rechnung geht an die Nordlicht Logistik GmbH & Co. KG mit einer
      Fälligkeit von 30 Tagen.
    entities:
      - type: DE_FIRMA
        value: "Nordlicht Logistik GmbH & Co. KG"
        expected_recall: must_detect

  - id: de-firma-003-ag
    text: >-
      Die Beteiligung an der Solaris Energie AG wurde gestern öffentlich
      bekanntgegeben.
    entities:
      - type: DE_FIRMA
        value: "Solaris Energie AG"
        expected_recall: must_detect

  - id: de-firma-004-ug
    text: >-
      Gegründet wurde die Kreativ UG (haftungsbeschränkt) erst im vergangenen
      Frühjahr.
    entities:
      - type: DE_FIRMA
        value: "Kreativ UG (haftungsbeschränkt)"
        expected_recall: must_detect

  # DE_STRASSE — Live-Befund 2026-08-03: "Bahnhofstraße 22" blieb im
  # maskierten Text unveraendert stehen (PLZ + Ort wurden erkannt, die
  # Strasse selbst von keinem Recognizer). Siehe recognizers-config.yml fuer
  # die zwei Muster (Kompositum hoher Score, getrennte Schreibweise
  # moderater Score).
  - id: de-strasse-001-kompositum
    text: >-
      Bitte senden Sie die Unterlagen an die Bahnhofstraße 22, 80331
      München.
    entities:
      - type: DE_STRASSE
        value: "Bahnhofstraße 22"
        expected_recall: must_detect

  - id: de-strasse-002-getrennt
    text: >-
      Die neue Anschrift lautet Neue Straße 5, 12345 Musterstadt.
    entities:
      - type: DE_STRASSE
        value: "Neue Straße 5"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # KOMBI-FÄLLE (mehrere Entitäten in einem Text, realistischer Use-Case)
  # ---------------------------------------------------------------------
  - id: kombi-001-kundenanfrage
    text: >-
      Kunde Herr Jonas Petersen, wohnhaft in der Ahornallee 9, 22303
      Hamburg, hat unter jonas.petersen@petersen-consulting.de angefragt.
      Seine Steuer-ID ist 98 765 432 109, IBAN DE12 5001 0517 0648 4898 90.
    entities:
      - type: PERSON
        value: "Jonas Petersen"
        expected_recall: must_detect
      - type: LOCATION
        value: "Ahornallee 9"
        expected_recall: must_detect
      - type: EMAIL_ADDRESS
        value: "jonas.petersen@petersen-consulting.de"
        expected_recall: must_detect
      - type: DE_STEUER_ID
        value: "98 765 432 109"
        expected_recall: must_detect
      - type: IBAN_CODE
        value: "DE12 5001 0517 0648 4898 90"
        expected_recall: must_detect

  # ---------------------------------------------------------------------
  # QUASI-IDENTIFIER (bekannte Lücke, aus Marktrecherche/Community-Thread)
  # Presidio + aktuelle Custom-Recognizer erkennen KEIN Wort hier einzeln
  # als PII, die Kombination ist aber re-identifizierend. expected_recall
  # ist bewusst "known_gap" gesetzt -- Ziel von ISC-"Quasi-Identifier" ist,
  # diese Fälle irgendwann auf must_detect umzustellen.
  # ---------------------------------------------------------------------
  - id: quasi-001-alter-geschlecht-beruf-ort
    text: >-
      Der Hinweisgeber ist 42, männlich, arbeitet als Ingenieur in Weimar
      und möchte anonym bleiben.
    entities:
      - type: QUASI_IDENTIFIER_COMBO
        value: "42, männlich, arbeitet als Ingenieur in Weimar"
        expected_recall: known_gap

  - id: quasi-002-position-firma-ort
    text: >-
      Die einzige Person mit dieser Rolle ist die Leiterin der Qualitätssicherung
      bei einem der drei großen Automobilzulieferer in Bamberg.
    entities:
      - type: QUASI_IDENTIFIER_COMBO
        value: "Leiterin der Qualitätssicherung bei einem der drei großen Automobilzulieferer in Bamberg"
        expected_recall: known_gap

  # ---------------------------------------------------------------------
  # DOKUMENTTITEL IN DATEINAMEN-FORM (bekannte Lücke, DATENSCHLE-65 Sec-L1)
  # Das citations-Feld document_title geht durch den Masker, aber die
  # Erkennung findet in Titeln mit Unterstrich/Punkt-Trennung keinen Namen
  # (gemessen mit lokalem Analyzer). Als known_gap festgehalten, damit die
  # Lücke nicht still verschwindet; Recall wird nur berichtet.
  # ---------------------------------------------------------------------
  - id: titel-001-dateiname-unterstrich
    text: >-
      Arztbrief_Mustermann.pdf
    entities:
      - type: PERSON
        value: "Mustermann"
        expected_recall: known_gap

  - id: titel-002-dateiname-leerzeichen
    text: >-
      Arztbrief Max Mustermann.pdf
    entities:
      - type: PERSON
        value: "Max Mustermann"
        expected_recall: known_gap

  # ---------------------------------------------------------------------
  # NEGATIV-FÄLLE (False-Positive-Köder — sehen wie PII aus, sind es nicht)
  # Der Benchmark zählt hier False Positives, wenn Presidio hier trotzdem
  # eine Entität meldet.
  # ---------------------------------------------------------------------
  - id: negativ-001-bestellnummer-keine-iban
    text: >-
      Die Bestellnummer für den Vorgang lautet BE89370400440532013000A,
      das ist keine Bankverbindung.
    entities: []

  - id: negativ-002-versionsnummer-keine-telefonnummer
    text: >-
      Die Software läuft ab Version 2026.07.22, das ist kein Datum eines
      Vorfalls.
    entities: []

  - id: negativ-003-produktcode-kein-kfz-kennzeichen
    text: >-
      Der Artikel mit der Produktkennung ABC-123 ist wieder auf Lager.
    entities: []

  - id: negativ-004-kalenderwoche-kein-aktenzeichen
    text: >-
